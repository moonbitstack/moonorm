name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        # pinned: the API page is generated from what this toolchain emits, and the
        # drift check below only means something if the emitter is fixed
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.1.20261023
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Generate .mbti for the core packages
        run: |
          for p in src src/schema src/query src/session src/migrate; do
            moon info --target js "$p"
          done

      - name: Build the showcase engine
        # the pages run this file: the library compiled to JavaScript, not a
        # hand-written re-implementation of its SQL rendering
        run: |
          moon build --target js src/examples/browser/showcase
          mkdir -p docs/engine
          cp _build/js/debug/build/examples/browser/showcase/showcase.js docs/engine/moonorm.js

      - name: Generate the API page
        run: python3 scripts/gen_api.py

      - name: Check the generated page is what is committed
        run: git diff --exit-code -- docs/api.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
