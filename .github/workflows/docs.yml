name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install MoonBit
        # the versioned download paths are not served, so take latest and record
        # what it resolved to: the API page is generated from this emitter
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Fetch the registry index
        # without this the dependency graph cannot be resolved on a fresh checkout
        run: |
          moon version --all
          moon update

      - name: Generate .mbti for every package the two API pages list
        run: |
          for p in src src/schema src/query src/session src/migrate; do
            moon info --target js "$p"
          done
          for m in db drivers/sqlite drivers/postgres drivers/mysql; do
            (cd "$m" && moon update && moon info --target js)
          done

      - name: Build the showcase engine
        # the pages run this file: the library compiled to JavaScript, not a
        # hand-written re-implementation of its SQL rendering
        run: |
          moon build --target js src/examples/browser/showcase
          mkdir -p docs/engine
          cp _build/js/debug/build/examples/browser/showcase/showcase.js docs/engine/moonorm.js

      - name: Generate the API page
        run: python3 scripts/gen_api.py

      - name: Check the generated pages are what is committed
        run: git diff --exit-code -- docs/api.html docs/moondb/api.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
