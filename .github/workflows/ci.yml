name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # The ORM at the repo root: it compiles and tests on every backend, on
  # three OSes.
  moonorm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    name: moonorm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: generated annotations are fresh
        run: |
          moon run src/cmd/orm --target native -- -C . src/examples/22-annotations/models.mbt -o src/examples/22-annotations/models.g.mbt --check
          moon run src/cmd/orm --target native -- -C . src/examples/guide/annotated/models.mbt -o src/examples/guide/annotated/models.g.mbt --check

      - name: generated mappers are fresh
        if: runner.os == 'Linux'
        run: moon run src/cmd/sql --target native -- -C . src/examples/23-sql-mapper/models.mbt -o src/examples/23-sql-mapper/mapper.g.mbt --check

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skill into a project, so they
      # have to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # End-to-end: the published ORM plus the published SQLite driver, driven against
  # a real SQLite file. It resolves its dependencies from mooncakes, so it runs
  # after those versions are published. Native-only (moonsqlite links C).
  integration:
    name: moone2e (native, real SQLite, published deps)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target native --deny-warn

      - name: moon build
        run: moon build --target native

      - name: moon test (native, real SQLite, published moonorm + moonsqlite)
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  # The PostgreSQL driver's real round trip runs on native and wasm against a
  # live postgres:16. Service containers are Linux-only, so this job is ubuntu-only.

  # The migration runner, the hybrids and the inheritance mappings against three real
  # databases at once: SQLite in-process, PostgreSQL and MySQL as service containers.
  # The module under test is the working tree, so the run has to see it as a workspace
  # member; `moon.work` is generated here rather than committed, because a checkout
  # without it must still build the library on its own.
  realdb:
    name: real databases (SQLite, PostgreSQL, MySQL)
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_USER: orm
          POSTGRES_DB: orm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: orm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -upw -ppw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: make the working tree a workspace member
        run: printf 'members = [\n  ".",\n  "./integration/realdb",\n]\n' > moon.work

      # The second implementation the ORM is differenced against: pinned in
      # integration/reference/requirements.txt, installed in a virtual environment
      # because the runner's system Python is externally managed.
      - name: install the SQLAlchemy and Alembic references
        run: |
          python3 -m venv "$RUNNER_TEMP/reference-venv"
          "$RUNNER_TEMP/reference-venv/bin/python" -m pip install --requirement integration/reference/requirements.txt

      - name: build the reference database
        run: '"$RUNNER_TEMP/reference-venv/bin/python" integration/reference/run.py emit --dir "$RUNNER_TEMP/reference"'

      - name: the reference vectors are what the references produce
        run: |
          "$RUNNER_TEMP/reference-venv/bin/python" scripts/gen_reference_vectors.py --check

      - name: moon test (native, three real databases)
        working-directory: integration/realdb
        env:
          MOONORM_LIVE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: orm
          PGPASSWORD: pw
          PGDATABASE: orm
          MYSQLHOST: 127.0.0.1
          MYSQLPORT: "3306"
          MYSQLUSER: root
          MYSQLPASSWORD: pw
          MYSQLDATABASE: orm
          # The MoonBit side reads the reference's database and writes one for it.
          MOONORM_REFERENCE_DIR: ${{ runner.temp }}/reference
        run: moon test --target native

      # The other half of the differential: SQLAlchemy reads the file this library
      # wrote, and the two schemas are compared with SQLite's own pragmas.
      - name: SQLAlchemy and this library agree
        run: |
          "$RUNNER_TEMP/reference-venv/bin/python" integration/reference/run.py compare --dir "$RUNNER_TEMP/reference"

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code
